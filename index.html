
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lava Pynguyn ULTRA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:#120000;
}

canvas{
display:block;
}

.screen{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:linear-gradient(#120000,#260000,#120000);
z-index:50;
}

.hidden{
display:none!important;
}

.title{
font-size:72px;
color:#ff7b00;
text-shadow:0 0 10px orange,0 0 30px red;
margin-bottom:20px;
}

button{
padding:14px 26px;
margin:10px;
font-size:20px;
border:none;
border-radius:18px;
background:#ff7b00;
color:white;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:scale(1.05);
}

input{
width:320px;
padding:14px;
margin:10px;
border:none;
border-radius:16px;
font-size:18px;
}

#topUI{
position:absolute;
top:10px;
left:10px;
z-index:100;
color:white;
}

#coins{
font-size:24px;
margin-top:6px;
}

#timer{
font-size:42px;
}

#slipBar{
width:250px;
height:20px;
background:#222;
border-radius:20px;
overflow:hidden;
margin-top:12px;
}

#slipFill{
width:0%;
height:100%;
background:linear-gradient(90deg,yellow,orange,red);
}

#scoreboard{
position:absolute;
right:10px;
top:100px;
width:230px;
background:rgba(0,0,0,.45);
padding:12px;
border-radius:18px;
z-index:100;
color:white;
}

#chat{
position:absolute;
left:10px;
bottom:10px;
width:300px;
height:220px;
background:rgba(0,0,0,.45);
border-radius:16px;
padding:10px;
z-index:100;
color:white;
}

#chatMessages{
height:160px;
overflow:auto;
}

#chatInput{
width:100%;
margin-top:6px;
}

#leaveBtn{
position:absolute;
right:10px;
bottom:10px;
z-index:100;
}

#alert{
position:absolute;
top:30%;
width:100%;
text-align:center;
font-size:70px;
font-weight:bold;
color:red;
display:none;
z-index:200;
text-shadow:0 0 20px black;
}

#skins{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:650px;
height:500px;
overflow:auto;
background:#220000;
border:3px solid orange;
border-radius:24px;
padding:20px;
display:none;
z-index:200;
color:white;
}

.skinCard{
background:#2b0000;
padding:16px;
border-radius:18px;
margin-top:16px;
}

#resultScreen{
position:absolute;
inset:0;
background:rgba(0,0,0,.9);
display:none;
z-index:300;
color:white;
align-items:center;
justify-content:center;
flex-direction:column;
}

#resultTitle{
font-size:70px;
margin-bottom:20px;
}

.cubeAnim{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:50px;
pointer-events:none;
animation:cubeFly 1s forwards;
z-index:999;
}

@keyframes cubeFly{
0%{
left:50%;
top:50%;
opacity:1;
}
100%{
left:100px;
top:20px;
opacity:0;
}
}

</style>
</head>
<body>

<div id="authScreen" class="screen">
<div class="title">LAVA PYNGUYN</div>

<input id="nameInput" placeholder="nombre">
<input id="emailInput" placeholder="correo">
<input id="passwordInput" type="password" placeholder="contraseña">

<button id="registerBtn">CREAR CUENTA</button>
<button id="loginBtn">INICIAR SESIÓN</button>
</div>

<div id="menuScreen" class="screen hidden">

<div class="title">MENÚ</div>

<button id="publicBtn">PARTIDA PÚBLICA</button>
<button id="privateBtn">PARTIDA PRIVADA</button>
<button id="trainingBtn">ENTRENAMIENTO</button>
<button id="customBtn">PERSONALIZAR</button>

</div>

<div id="privateScreen" class="screen hidden">

<div class="title">PARTIDA PRIVADA</div>

<button id="createRoomBtn">CREAR PARTIDA</button>

<input id="roomInput" placeholder="CÓDIGO">

<button id="joinRoomBtn">UNIRSE</button>

</div>

<div id="roomScreen" class="screen hidden">

<div class="title">SALA</div>

<div id="roomCode" style="font-size:50px;color:gold"></div>

<div id="lobbyPlayers"></div>

<button id="startBtn">ESPERANDO</button>

</div>

<div id="skins">

<h1>PERSONALIZAR</h1>

<div class="skinCard">
<h2>🐧 NORMAL</h2>
<button onclick="equipSkin('normal')">EQUIPAR</button>
</div>

<div class="skinCard">
<h2>💰 RICO</h2>
<p>1000 CUBOS</p>
<button onclick="buySkin('rich',1000)">COMPRAR</button>
</div>

<div class="skinCard">
<h2>🧟 ZOMBIE</h2>
<p>800 CUBOS</p>
<button onclick="buySkin('zombie',800)">COMPRAR</button>
</div>

<div class="skinCard">
<h2>🔥 ROJO</h2>
<p>50 CUBOS</p>
<button onclick="buySkin('red',50)">COMPRAR</button>
</div>

<div class="skinCard">
<h2>🍔 HAMBRIADO</h2>
<p>400 CUBOS</p>
<button onclick="buySkin('hambre',400)">COMPRAR</button>
</div>

<br>

<button onclick="closeSkins()">CERRAR</button>

</div>

<div id="topUI" class="hidden">

<div id="timer">2:30</div>

<div id="coins">🧊 0</div>

<div id="slipBar">
<div id="slipFill"></div>
</div>

</div>

<div id="chat" class="hidden">

<div id="chatMessages"></div>

<input id="chatInput" placeholder="mensaje...">

</div>

<div id="scoreboard"></div>

<button id="leaveBtn">SALIR</button>

<div id="alert">🚨 ALERTA DE TREN 🚨</div>

<div id="resultScreen">

<div id="resultTitle">SOBREVIVIENTES</div>

<div id="resultPlayers"></div>

</div>

<canvas id="game"></canvas>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"

import {
getFirestore,
doc,
setDoc,
getDoc,
updateDoc,
collection,
onSnapshot,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"

const firebaseConfig={
apiKey:"AIzaSyBy1mulELJTWX0AF-ludd-KCvNysc46miA",
authDomain:"lava-pynguyn.firebaseapp.com",
projectId:"lava-pynguyn",
storageBucket:"lava-pynguyn.firebasestorage.app",
messagingSenderId:"642131777706",
appId:"1:642131777706:web:1b4f6c8a47bb184c8e98d3"
}

const app=initializeApp(firebaseConfig)
const auth=getAuth(app)
const db=getFirestore(app)

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

function resize(){
canvas.width=innerWidth
canvas.height=innerHeight
}

resize()

addEventListener("resize",resize)

const state={
currentUser:null,
coins:0,
skin:"normal",
game:false,
timer:150
}

const player={
name:"PLAYER",
x:0,
y:0,
speed:0,
lava:false,
slip:0,
lives:1
}

let onlinePlayers=[]
let currentRoom=""

const pathWidth=48

const cubes=[]
for(let i=0;i<120;i++){
cubes.push({
x:(Math.random()-.5)*28,
y:-i*180,
taken:false
})
}

const lavaPenguins=[]

for(let i=0;i<6;i++){
lavaPenguins.push({
side:Math.random()>.5?1:-1,
y:-Math.random()*6000,
jump:0,
jumping:false
})
}

const train={
active:false,
y:99999
}

const keys={}

addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true
})

addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false
})

function show(screen){

authScreen.classList.add("hidden")
menuScreen.classList.add("hidden")
privateScreen.classList.add("hidden")
roomScreen.classList.add("hidden")

screen.classList.remove("hidden")

}

registerBtn.onclick=async()=>{

try{

const email=emailInput.value.trim()
const password=passwordInput.value.trim()
const username=nameInput.value.trim()

const cred=await createUserWithEmailAndPassword(
auth,
email,
password
)

await setDoc(
doc(db,"users",cred.user.uid),
{
name:username,
coins:0,
skin:"normal"
}
)

alert("CUENTA CREADA")

}catch(err){

alert(err.message)

}

}

loginBtn.onclick=async()=>{

try{

const cred=await signInWithEmailAndPassword(
auth,
emailInput.value.trim(),
passwordInput.value.trim()
)

state.currentUser=cred.user

const snap=await getDoc(
doc(db,"users",cred.user.uid)
)

if(snap.exists()){

const d=snap.data()

player.name=d.name
state.coins=d.coins||0
state.skin=d.skin||"normal"

}

coins.innerHTML="🧊 "+state.coins

show(menuScreen)

}catch(err){

alert("ERROR LOGIN")

}

}

customBtn.onclick=()=>{
skins.style.display="block"
}

window.closeSkins=()=>{
skins.style.display="none"
}

window.equipSkin=async(s)=>{

state.skin=s

await updateDoc(
doc(db,"users",state.currentUser.uid),
{
skin:s
}
)

alert("EQUIPADA")

}

window.buySkin=async(name,price)=>{

if(state.coins<price){
alert("NO TIENES CUBOS")
return
}

state.coins-=price

coins.innerHTML="🧊 "+state.coins

state.skin=name

await updateDoc(
doc(db,"users",state.currentUser.uid),
{
coins:state.coins,
skin:name
}
)

alert("COMPRADA")

}

privateBtn.onclick=()=>{
show(privateScreen)
}

trainingBtn.onclick=()=>{
startGame()
}

publicBtn.onclick=()=>{
startGame()
}

function randomCode(){

const chars="ABCDEFG123456789"

let code=""

for(let i=0;i<5;i++){

code+=chars[
Math.floor(Math.random()*chars.length)
]

}

return code

}

createRoomBtn.onclick=async()=>{

const code=randomCode()

currentRoom=code

await setDoc(
doc(db,"rooms",code),
{
created:serverTimestamp()
}
)

await setDoc(
doc(db,"rooms",code,"players",state.currentUser.uid),
{
name:player.name,
x:0,
y:0,
lava:false,
skin:state.skin
}
)

listenRoom(code)

roomCode.innerHTML=code

show(roomScreen)

}

joinRoomBtn.onclick=async()=>{

const code=roomInput.value.toUpperCase()

currentRoom=code

await setDoc(
doc(db,"rooms",code,"players",state.currentUser.uid),
{
name:player.name,
x:0,
y:0,
lava:false,
skin:state.skin
}
)

listenRoom(code)

roomCode.innerHTML=code

show(roomScreen)

}

function listenRoom(code){

const ref=collection(db,"rooms",code,"players")

onSnapshot(ref,snap=>{

onlinePlayers=[]

snap.forEach(d=>{

onlinePlayers.push(d.data())

})

renderLobby()

})

}

function renderLobby(){

let html=""

onlinePlayers.forEach(p=>{

html+=`
<div>
${p.lava?"🔥":"🐧"} ${p.name}
</div>
`

})

html+=`<br>${onlinePlayers.length}/5`

lobbyPlayers.innerHTML=html

if(onlinePlayers.length>=2){

startBtn.innerHTML="JUGAR"

startBtn.onclick=()=>{
startGame()
}

}

}

function startGame(){

state.game=true

menuScreen.classList.add("hidden")
privateScreen.classList.add("hidden")
roomScreen.classList.add("hidden")

topUI.classList.remove("hidden")
chat.classList.remove("hidden")

}

chatInput.addEventListener("keydown",e=>{

if(e.key==="Enter"){

const div=document.createElement("div")

div.innerHTML=`🐧 ${player.name}: ${chatInput.value}`

chatMessages.appendChild(div)

chatInput.value=""

chatMessages.scrollTop=chatMessages.scrollHeight

}

})

function cubeAnim(){

const div=document.createElement("div")

div.className="cubeAnim"

div.innerHTML="🧊 +1"

document.body.appendChild(div)

setTimeout(()=>{
div.remove()
},1000)

}

function giveCoins(amount){

state.coins+=amount

coins.innerHTML="🧊 "+state.coins

cubeAnim()

}

setInterval(()=>{

if(state.game&&!train.active){

train.active=true

train.y=player.y+1800

alert.style.display="block"

setTimeout(()=>{
alert.style.display="none"
},2000)

}

},30000)

function update(){

if(!state.game)return

if(keys["shift"]){

player.speed=3.4
player.slip+=0.35

}else if(
keys["w"]||
keys["a"]||
keys["d"]
){

player.speed=2
player.slip+=0.1

}else{

player.speed=0
player.slip-=0.35

}

player.slip=Math.max(
0,
Math.min(100,player.slip)
)

if(player.slip>=100){

player.lava=true

if(player.x>0){
player.x=pathWidth/2+55
}else{
player.x=-pathWidth/2-55
}

}

if(keys["a"])player.x-=player.speed
if(keys["d"])player.x+=player.speed

if(keys["w"])player.y-=2

if(!player.lava){

player.x=Math.max(
-pathWidth/2,
Math.min(pathWidth/2,player.x)
)

}

lavaPenguins.forEach(lp=>{

lp.y+=2.5

if(
Math.abs(lp.y-player.y)<260
&&!lp.jumping
){

lp.jumping=true
lp.jump=65

}

if(lp.jumping){

lp.jump-=2

if(lp.jump<=0){

lp.jump=0
lp.jumping=false

}

}

const lavaX=(pathWidth/2+55)*lp.side

const dx=player.x-lavaX
const dy=player.y-lp.y

if(
Math.abs(dx)<40&&
Math.abs(dy)<40&&
lp.jumping
){

player.x+=lp.side*22
player.slip+=30

}

})

cubes.forEach(c=>{

if(c.taken)return

const dx=player.x-c.x
const dy=player.y-c.y

if(
Math.abs(dx)<15&&
Math.abs(dy)<15
){

c.taken=true

giveCoins(1)

}

})

if(train.active){

train.y-=3

if(
train.y<player.y+80&&
train.y>player.y-80
){

player.lava=true

}

if(train.y<player.y-2000){

train.active=false

}

}

if(currentRoom){

setDoc(
doc(
db,
"rooms",
currentRoom,
"players",
state.currentUser.uid
),
{
name:player.name,
x:player.x,
y:player.y,
lava:player.lava,
skin:state.skin
}
)

}

let alive=onlinePlayers.filter(p=>!p.lava)

if(
onlinePlayers.length>0&&
alive.length<=1
){

finishGame()

}

state.timer-=1/60

if(state.timer<=0){

finishGame()

}

const mins=Math.floor(state.timer/60)

const secs=Math.floor(state.timer%60)
.toString()
.padStart(2,"0")

timer.innerHTML=`${mins}:${secs}`

slipFill.style.width=player.slip+"%"

updateBoard()

}

function finishGame(){

state.game=false

resultScreen.style.display="flex"

let survivors=onlinePlayers.filter(p=>!p.lava)

let html=""

survivors.forEach(s=>{

html+=`
<div style="font-size:30px;margin:10px">
🐧 ${s.name}
</div>
`

})

if(!player.lava){

giveCoins(10)

}

resultPlayers.innerHTML=html

setTimeout(()=>{

location.reload()

},7000)

}

function updateBoard(){

let html="<h2>JUGADORES</h2>"

onlinePlayers.forEach(p=>{

html+=`
<div>
${p.lava?"🔥":"🐧"} ${p.name}
</div>
`

})

scoreboard.innerHTML=html

}

function drawPenguin(x,y,lava=false,skin="normal"){

ctx.save()

ctx.translate(x,y)

if(skin==="rich"){
ctx.fillStyle="gold"
}else if(skin==="zombie"){
ctx.fillStyle="#7dff7d"
}else if(skin==="red"){
ctx.fillStyle="red"
}else if(skin==="hambre"){
ctx.fillStyle="#d98b2b"
}else{
ctx.fillStyle=lava?"#ff5e00":"white"
}

ctx.beginPath()
ctx.ellipse(0,0,16,22,0,0,6.28)
ctx.fill()

ctx.fillStyle="black"

ctx.beginPath()
ctx.arc(-4,-4,2,0,6.28)
ctx.arc(4,-4,2,0,6.28)
ctx.fill()

ctx.fillStyle="orange"

ctx.beginPath()
ctx.moveTo(0,2)
ctx.lineTo(-4,7)
ctx.lineTo(4,7)
ctx.fill()

ctx.restore()

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

for(let y=0;y<canvas.height;y+=40){

ctx.fillStyle=`rgb(${160+Math.sin(Date.now()*0.002+y)*30},40,0)`

ctx.fillRect(0,y,canvas.width,40)

}

const cx=canvas.width/2

ctx.fillStyle="#5b3418"

ctx.beginPath()

ctx.moveTo(cx-pathWidth/2,0)
ctx.lineTo(cx+pathWidth/2,0)
ctx.lineTo(cx+pathWidth/2+15,canvas.height)
ctx.lineTo(cx-pathWidth/2-15,canvas.height)

ctx.fill()

for(let i=0;i<80;i++){

ctx.fillStyle="rgba(255,120,0,.08)"

ctx.beginPath()

ctx.arc(
(Math.sin(i*999)+1)*canvas.width/2,
(Date.now()*0.05+i*80)%canvas.height,
2,
0,
6.28
)

ctx.fill()

}

cubes.forEach(c=>{

if(c.taken)return

const sy=c.y-player.y+canvas.height/2

ctx.shadowBlur=20
ctx.shadowColor="gold"

ctx.fillStyle="gold"

ctx.beginPath()

ctx.arc(cx+c.x,sy,8,0,6.28)

ctx.fill()

})

lavaPenguins.forEach(lp=>{

const sy=lp.y-player.y+canvas.height/2

const lavaX=(pathWidth/2+55)*lp.side

ctx.fillStyle="rgba(255,70,0,.2)"

ctx.beginPath()

ctx.arc(cx+lavaX,sy+20,35,0,6.28)

ctx.fill()

drawPenguin(
cx+lavaX,
sy-lp.jump,
true
)

})

onlinePlayers.forEach(op=>{

if(op.name===player.name)return

const sy=op.y-player.y+canvas.height/2

const px=cx+op.x

ctx.fillStyle="white"
ctx.font="18px Arial"

ctx.fillText(op.name,px-20,sy-30)

drawPenguin(px,sy,op.lava,op.skin)

})

if(train.active){

const ty=train.y-player.y+canvas.height/2

ctx.fillStyle="#444"

ctx.fillRect(cx-120,ty,240,140)

ctx.fillStyle="yellow"

ctx.fillRect(cx-70,ty+30,40,40)
ctx.fillRect(cx+30,ty+30,40,40)

}

const py=canvas.height-170

ctx.fillStyle="rgba(0,0,0,.3)"

ctx.beginPath()

ctx.ellipse(
cx+player.x,
py+22,
18,
8,
0,
0,
6.28
)

ctx.fill()

ctx.fillStyle="white"
ctx.font="18px Arial"

ctx.fillText(
player.name,
cx+player.x-20,
py-30
)

drawPenguin(
cx+player.x,
py,
player.lava,
state.skin
)

}

leaveBtn.onclick=()=>{
location.reload()
}

function loop(){

update()
draw()

requestAnimationFrame(loop)

}

loop()

</script>

</body>
</html>
