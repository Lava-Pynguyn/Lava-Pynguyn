<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lava Pynguyn ULTRA</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:#120000;
}

canvas{
display:block;
}

.screen{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:
linear-gradient(
#120000,
#260000,
#120000
);
z-index:30;
}

.hidden{
display:none!important;
}

.title{
font-size:72px;
color:#ff7b00;
text-shadow:
0 0 10px orange,
0 0 30px red;
margin-bottom:20px;
}

button{
padding:14px 26px;
margin:10px;
font-size:20px;
border:none;
border-radius:18px;
background:#ff7b00;
color:white;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:scale(1.05);
}

input{
width:320px;
padding:14px;
margin:10px;
border:none;
border-radius:16px;
font-size:18px;
}

#topUI{
position:absolute;
top:10px;
left:10px;
z-index:50;
color:white;
}

#coins{
font-size:26px;
margin-top:8px;
}

#timer{
font-size:40px;
}

#slipBar{
width:230px;
height:20px;
background:#222;
border-radius:20px;
overflow:hidden;
margin-top:12px;
}

#slipFill{
width:0%;
height:100%;
background:
linear-gradient(
90deg,
yellow,
orange,
red
);
}

#chat{
position:absolute;
left:10px;
bottom:10px;
width:290px;
height:200px;
background:rgba(0,0,0,.4);
border-radius:16px;
padding:10px;
color:white;
z-index:50;
}

#chatMessages{
height:140px;
overflow:auto;
font-size:14px;
}

#chatInput{
width:100%;
margin-top:10px;
}

#scoreboard{
position:absolute;
right:10px;
top:100px;
width:220px;
background:rgba(0,0,0,.4);
padding:10px;
border-radius:16px;
color:white;
z-index:60;
}

#leaveBtn{
position:absolute;
right:10px;
bottom:10px;
z-index:60;
}

#alert{
position:absolute;
width:100%;
top:35%;
text-align:center;
font-size:70px;
font-weight:bold;
color:red;
display:none;
z-index:100;
text-shadow:0 0 20px black;
}

.cubeAnim{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:50px;
pointer-events:none;
animation:cubeFly 1s forwards;
z-index:100;
}

@keyframes cubeFly{
0%{
left:50%;
top:50%;
opacity:1;
}
100%{
left:80px;
top:20px;
opacity:0;
}
}

#deathScreen{
position:absolute;
inset:0;
background:rgba(0,0,0,.8);
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:999;
color:white;
font-size:50px;
}

</style>
</head>
<body>

<div id="authScreen" class="screen">
<div class="title">LAVA PYNGUYN</div>

<input id="nameInput" placeholder="nombre">
<input id="emailInput" placeholder="correo">
<input id="passwordInput" type="password" placeholder="contraseña">

<button id="registerBtn">CREAR CUENTA</button>
<button id="loginBtn">INICIAR SESIÓN</button>
</div>

<div id="menuScreen" class="screen hidden">
<div class="title">MENÚ</div>

<button id="publicBtn">PARTIDA PÚBLICA</button>
<button id="trainingBtn">ENTRENAMIENTO</button>
</div>

<div id="topUI" class="hidden">
<div id="timer">2:30</div>
<div id="coins">🧊 0</div>

<div id="slipBar">
<div id="slipFill"></div>
</div>
</div>

<div id="chat" class="hidden">
<div id="chatMessages"></div>
<input id="chatInput" placeholder="mensaje...">
</div>

<div id="scoreboard"></div>

<button id="leaveBtn">
SALIR
</button>

<div id="alert">
🚨 ALERTA DE TREN 🚨
</div>

<div id="deathScreen">
<div>🔥 TE CAÍSTE A LA LAVA 🔥</div>
<button onclick="location.reload()">VOLVER</button>
</div>

<canvas id="game"></canvas>

<script type="module">

import { initializeApp }
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
}
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'

import {
getFirestore,
doc,
setDoc,
getDoc
}
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'

const firebaseConfig={
apiKey:"AIzaSyBy1mulELJTWX0AF-ludd-KCvNysc46miA",
authDomain:"lava-pynguyn.firebaseapp.com",
projectId:"lava-pynguyn",
storageBucket:"lava-pynguyn.firebasestorage.app",
messagingSenderId:"642131777706",
appId:"1:642131777706:web:1b4f6c8a47bb184c8e98d3"
}

const app=initializeApp(firebaseConfig)
const auth=getAuth(app)
const db=getFirestore(app)

const canvas=document.getElementById('game')
const ctx=canvas.getContext('2d')

canvas.width=innerWidth
canvas.height=innerHeight

const screens={
auth:authScreen,
menu:menuScreen
}

function show(name){
Object.values(screens)
.forEach(s=>s.classList.add('hidden'))

screens[name].classList.remove('hidden')
}

const state={
coins:0,
timer:150,
game:false
}

const player={
name:'PLAYER',
x:0,
y:0,
speed:0,
slip:0,
lava:false
}

const keys={}

addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true
})

addEventListener('keyup',e=>{
keys[e.key.toLowerCase()]=false
})

registerBtn.onclick=async()=>{

try{

const cred=
await createUserWithEmailAndPassword(
auth,
emailInput.value,
passwordInput.value
)

await setDoc(
doc(db,'users',cred.user.uid),
{
name:nameInput.value,
coins:0
}
)

alert('Cuenta creada')

}catch(err){

alert(err.message)

}

}

loginBtn.onclick=async()=>{

try{

const cred=
await signInWithEmailAndPassword(
auth,
emailInput.value,
passwordInput.value
)

const snap=
await getDoc(
doc(db,'users',cred.user.uid)
)

if(snap.exists()){

const d=snap.data()

player.name=d.name
state.coins=d.coins||0

}

coins.innerHTML='🧊 '+state.coins

show('menu')

}catch(err){

alert(err.message)

}

}

publicBtn.onclick=startGame
trainingBtn.onclick=startGame

function startGame(){

state.game=true

Object.values(screens)
.forEach(s=>s.classList.add('hidden'))

topUI.classList.remove('hidden')
chat.classList.remove('hidden')

}

const pathWidth=70

const cubes=[]

for(let i=0;i<120;i++){

cubes.push({
x:(Math.random()-.5)*50,
y:-i*180,
taken:false
})

}

const lavaPenguins=[]

for(let i=0;i<8;i++){

lavaPenguins.push({
side:Math.random()>.5?1:-1,
y:-Math.random()*6000,
jump:0,
jumping:false
})

}

const train={
active:false,
y:0
}

setInterval(()=>{

if(state.game&&!train.active){

train.active=true

train.y=player.y+2500

alert.style.display='block'

setTimeout(()=>{
alert.style.display='none'
},2000)

}

},25000)

function cubeAnim(){

const div=document.createElement('div')

div.className='cubeAnim'

div.innerHTML='🧊 +1'

document.body.appendChild(div)

setTimeout(()=>{
div.remove()
},1000)

}

function die(){

player.lava=true

deathScreen.style.display='flex'

}

function update(){

if(!state.game)return

if(keys['shift']){

player.speed=3.4
player.slip+=0.4

}else if(
keys['w']||
keys['a']||
keys['d']
){

player.speed=2
player.slip+=0.1

}else{

player.speed=0
player.slip-=0.35

}

player.slip=
Math.max(
0,
Math.min(100,player.slip)
)

if(player.slip>=100){

die()

}

if(keys['a'])player.x-=player.speed
if(keys['d'])player.x+=player.speed
if(keys['w'])player.y-=2.2

if(
player.x<-pathWidth/2||
player.x>pathWidth/2
){

die()

}

lavaPenguins.forEach(lp=>{

lp.y+=2.5

if(
Math.abs(lp.y-player.y)<240
&&!lp.jumping
){

lp.jumping=true
lp.jump=70

}

if(lp.jumping){

lp.jump-=2

if(lp.jump<=0){

lp.jump=0
lp.jumping=false

}

}

const lavaX=
(pathWidth/2+85)*lp.side

if(
Math.abs(player.x-lavaX)<55
&&
Math.abs(player.y-lp.y)<55
&&
lp.jumping
){

player.x+=lp.side*20
player.slip+=15

}

})

if(train.active){

train.y-=3

if(
train.y<player.y+100
&&
train.y>player.y-100
){

if(
player.x>-40
&&player.x<40
){

die()

}

}

if(train.y<player.y-3000){

train.active=false

}

}

cubes.forEach(c=>{

if(c.taken)return

const dx=player.x-c.x
const dy=player.y-c.y

if(
Math.abs(dx)<20
&&
Math.abs(dy)<20
){

c.taken=true

state.coins++

coins.innerHTML=
'🧊 '+state.coins

cubeAnim()

}

})

state.timer-=1/60

if(state.timer<=0){

alert('GANASTE')

location.reload()

}

const mins=
Math.floor(state.timer/60)

const secs=
Math.floor(state.timer%60)
.toString()
.padStart(2,'0')

timer.innerHTML=
`${mins}:${secs}`

slipFill.style.width=
player.slip+'%'

}

function drawPenguin(x,y,lava=false){

ctx.save()

ctx.translate(x,y)

ctx.fillStyle=
lava?'#ff4d00':'white'

ctx.beginPath()
ctx.ellipse(0,0,16,22,0,0,6.28)
ctx.fill()

ctx.fillStyle='black'

ctx.beginPath()
ctx.arc(-4,-5,2,0,6.28)
ctx.arc(4,-5,2,0,6.28)
ctx.fill()

ctx.fillStyle='orange'

ctx.beginPath()
ctx.moveTo(0,2)
ctx.lineTo(-4,7)
ctx.lineTo(4,7)
ctx.fill()

ctx.restore()

}

function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
)

const cx=canvas.width/2

for(let y=0;y<canvas.height;y+=40){

ctx.fillStyle=
`rgb(
${180+Math.sin(Date.now()*0.002+y)*30},
40,
0
)`

ctx.fillRect(
0,
y,
canvas.width,
40
)

}

for(let i=0;i<80;i++){

ctx.fillStyle=
`rgba(255,${80+Math.random()*100},0,.35)`

ctx.beginPath()

ctx.arc(
(Math.sin(i*999)+1)*canvas.width/2,
(Date.now()*0.05+i*80)%canvas.height,
2+Math.random()*3,
0,
6.28
)

ctx.fill()

}

ctx.fillStyle='#2b1308'

ctx.beginPath()

ctx.moveTo(cx-pathWidth/2,0)
ctx.lineTo(cx+pathWidth/2,0)
ctx.lineTo(cx+pathWidth/2+30,canvas.height)
ctx.lineTo(cx-pathWidth/2-30,canvas.height)

ctx.fill()

for(let y=0;y<canvas.height;y+=50){

ctx.fillStyle='rgba(255,255,255,.04)'

ctx.fillRect(
cx-pathWidth/2,
y,
pathWidth,
20
)

}

cubes.forEach(c=>{

if(c.taken)return

const sy=
c.y-player.y+
canvas.height/2

ctx.shadowBlur=20
ctx.shadowColor='gold'

ctx.fillStyle='gold'

ctx.beginPath()

ctx.arc(
cx+c.x,
sy,
9,
0,
6.28
)

ctx.fill()

})

lavaPenguins.forEach(lp=>{

const sy=
lp.y-player.y+
canvas.height/2

const lavaX=
(pathWidth/2+85)*lp.side

ctx.fillStyle=
'rgba(255,80,0,.3)'

ctx.beginPath()

ctx.arc(
cx+lavaX,
sy+20,
35,
0,
6.28
)

ctx.fill()

drawPenguin(
cx+lavaX,
sy-lp.jump,
true
)

})

if(train.active){

const ty=
train.y-player.y+
canvas.height/2

ctx.fillStyle='#444'

ctx.fillRect(
cx-110,
ty,
220,
180
)

ctx.fillStyle='yellow'

ctx.fillRect(cx-65,ty+35,35,35)
ctx.fillRect(cx+30,ty+35,35,35)

}

const py=canvas.height-170

ctx.fillStyle='rgba(0,0,0,.3)'

ctx.beginPath()

ctx.ellipse(
cx+player.x,
py+20,
20,
8,
0,
0,
6.28
)

ctx.fill()

ctx.fillStyle='white'
ctx.font='18px Arial'

ctx.fillText(
player.name,
cx+player.x-20,
py-30
)

drawPenguin(
cx+player.x,
py,
player.lava
)

}

leaveBtn.onclick=()=>{
location.reload()
}

chatInput.addEventListener('keydown',e=>{

if(e.key==='Enter'){

const div=
document.createElement('div')

div.innerHTML=
`🐧 ${player.name}: ${chatInput.value}`

chatMessages.appendChild(div)

chatInput.value=''

chatMessages.scrollTop=
chatMessages.scrollHeight

}

})

function loop(){

update()
draw()

requestAnimationFrame(loop)

}

loop()

</script>

</body>
</html>
