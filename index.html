<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lava Pynguyn</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:#120000;
color:white;
}

canvas{
display:block;
background:#1a0000;
}

.screen{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:linear-gradient(#120000,#300000);
z-index:20;
}

.hidden{
display:none;
}

.title{
font-size:70px;
color:#ff7b00;
text-shadow:0 0 25px red;
margin-bottom:20px;
}

.subtitle{
margin-bottom:20px;
font-size:22px;
opacity:.8;
}

input{
width:320px;
padding:14px;
margin:8px;
border:none;
border-radius:14px;
font-size:18px;
}

button{
padding:14px 28px;
margin:10px;
font-size:20px;
border:none;
border-radius:16px;
background:#ff7b00;
color:white;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:scale(1.05);
}

.disabled{
background:#555 !important;
cursor:not-allowed;
}

#topUI{
position:absolute;
top:10px;
left:10px;
z-index:5;
}

#slipBar{
width:240px;
height:22px;
background:#333;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

#slipFill{
height:100%;
width:0%;
background:orange;
}

#timer{
font-size:30px;
margin-top:10px;
}

#coins{
font-size:24px;
margin-top:8px;
}

#cartBtn{
position:absolute;
top:15px;
right:15px;
z-index:50;
font-size:22px;
padding:10px 18px;
}

#shop{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:500px;
height:400px;
background:#220000;
border:3px solid orange;
border-radius:20px;
z-index:60;
padding:20px;
display:none;
}

#shop h2{
margin-bottom:20px;
}

.shopItem{
background:#330000;
padding:20px;
border-radius:14px;
margin-top:10px;
}

#alert{
position:absolute;
width:100%;
top:35%;
text-align:center;
font-size:70px;
font-weight:bold;
color:red;
text-shadow:0 0 20px black;
display:none;
z-index:10;
}

.playerName{
font-size:18px;
margin:4px;
}

</style>
</head>
<body>

<!-- LOGIN -->

<div id="authScreen" class="screen">

<div class="title">LAVA PYNGUYN</div>

<div class="subtitle">
Escapa del tren y de los pingüinos de lava
</div>

<input id="name" placeholder="nombre">

<input id="email" placeholder="correo">

<input
id="password"
type="password"
placeholder="contraseña">

<button onclick="register()">
CREAR CUENTA
</button>

<button onclick="login()">
INICIAR SESIÓN
</button>

</div>

<!-- MENU -->

<div id="menuScreen" class="screen hidden">

<div class="title">JUGAR</div>

<button onclick="openPublic()">
PARTIDA PÚBLICA
</button>

<button onclick="openPrivate()">
PARTIDA PRIVADA
</button>

</div>

<!-- PUBLIC -->

<div id="publicScreen" class="screen hidden">

<div class="title">
BUSCANDO PARTIDA
</div>

<div id="publicCount">
1/5
</div>

</div>

<!-- PRIVATE -->

<div id="privateScreen" class="screen hidden">

<div class="title">
PARTIDA PRIVADA
</div>

<button onclick="createRoom()">
CREAR PARTIDA
</button>

<input
id="roomInput"
placeholder="código">

<button onclick="joinRoom()">
UNIRSE
</button>

</div>

<!-- ROOM -->

<div id="roomScreen" class="screen hidden">

<div class="title">
SALA
</div>

<div
id="roomCode"
style="font-size:50px;color:gold;">
AAAAA
</div>

<div id="lobbyPlayers"></div>

<button
id="startBtn"
class="disabled">

MÍNIMO 3 JUGADORES

</button>

</div>

<!-- SHOP -->

<button
id="cartBtn"
class="hidden"
onclick="toggleShop()">

🛒

</button>

<div id="shop">

<h2>TIENDA</h2>

<div class="shopItem">
Próximamente...
</div>

<button onclick="toggleShop()">
CERRAR
</button>

</div>

<!-- UI -->

<div id="topUI" class="hidden">

<div id="timer">
2:30
</div>

<div id="coins">
🧊 0
</div>

<div id="slipBar">
<div id="slipFill"></div>
</div>

</div>

<div id="alert">
🚨 ALERTA 🚨
</div>

<canvas id="game"></canvas>

<script type="module">

import { initializeApp }
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
}
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'

import {
getFirestore,
doc,
setDoc,
getDoc,
updateDoc,
onSnapshot,
increment
}
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'

const firebaseConfig = {

apiKey: "AIzaSyBy1mulELJTWX0AF-ludd-KCvNysc46miA",

authDomain: "lava-pynguyn.firebaseapp.com",

projectId: "lava-pynguyn",

storageBucket: "lava-pynguyn.firebasestorage.app",

messagingSenderId: "642131777706",

appId: "1:642131777706:web:1b4f6c8a47bb184c8e98d3"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const canvas =
document.getElementById('game');

const ctx =
canvas.getContext('2d');

canvas.width = innerWidth;
canvas.height = innerHeight;

const screens = {
auth: authScreen,
menu: menuScreen,
public: publicScreen,
private: privateScreen,
room: roomScreen
};

function show(name){

Object.values(screens)
.forEach(s=>s.classList.add('hidden'));

screens[name]
.classList.remove('hidden');

}

let currentUser=null;

let roomId='';

let gameStarted=false;

let timer=150;

const player={

name:'',

x:0,
y:0,

vx:0,
vy:0,

slip:0,

lava:false,

coins:0

};

const keys={};

addEventListener('keydown',e=>{

keys[e.key.toLowerCase()]=true;

});

addEventListener('keyup',e=>{

keys[e.key.toLowerCase()]=false;

});

window.register = async ()=>{

const email =
document.getElementById('email').value;

const password =
document.getElementById('password').value;

const name =
document.getElementById('name').value;

if(!email || !password || !name){

alert('Completa todo');

return;

}

try{

const cred =
await createUserWithEmailAndPassword(
auth,
email,
password
);

await setDoc(
doc(db,'users',cred.user.uid),
{
name:name,
magma:0,
wins:0
}
);

alert('Cuenta creada');

}catch(err){

alert(err.message);

}

};

window.login = async ()=>{

const email =
document.getElementById('email').value;

const password =
document.getElementById('password').value;

try{

const cred =
await signInWithEmailAndPassword(
auth,
email,
password
);

currentUser = cred.user;

const snap =
await getDoc(
doc(db,'users',cred.user.uid)
);

const data = snap.data();

player.name = data.name;

player.coins = data.magma || 0;

coins.innerHTML =
'🧊 '+player.coins;

show('menu');

cartBtn.classList.remove('hidden');

}catch(err){

alert(err.message);

}

};

window.toggleShop = ()=>{

if(shop.style.display==='block'){

shop.style.display='none';

}else{

shop.style.display='block';

}

};

window.openPublic = ()=>{

show('public');

let count=1;

const interval=setInterval(()=>{

count++;

publicCount.innerHTML =
count+'/5';

if(count>=5){

clearInterval(interval);

startGame();

}

},1000);

};

window.openPrivate = ()=>{

show('private');

};

function randomCode(){

const chars='ABCDEFGHJKLMNPQRSTUVWXYZ123456789';

let code='';

for(let i=0;i<5;i++){

code +=
chars[
Math.floor(
Math.random()*chars.length
)
];

}

return code;

}

window.createRoom = ()=>{

roomId=randomCode();

roomCode.innerHTML=roomId;

show('room');

updateRoom([player.name]);

};

window.joinRoom = ()=>{

const code =
roomInput.value.toUpperCase();

if(code.length<5){

alert('Código inválido');

return;

}

roomId=code;

roomCode.innerHTML=roomId;

show('room');

updateRoom([
player.name,
'Jugador2',
'Jugador3'
]);

};

function updateRoom(players){

let html='';

players.forEach(p=>{

html +=
`<div class="playerName">
🐧 ${p}
</div>`;

});

html += `<br>${players.length}/5`;

lobbyPlayers.innerHTML=html;

if(players.length>=3){

startBtn.classList.remove('disabled');

startBtn.innerHTML='JUGAR';

startBtn.onclick=()=>{

alert(
players[
Math.floor(
Math.random()*players.length
)
]
+
' ES EL PINGÜINO DE LAVA'
);

startGame();

};

}

}

function startGame(){

gameStarted=true;

Object.values(screens)
.forEach(s=>s.classList.add('hidden'));

topUI.classList.remove('hidden');

}

const pathWidth=240;

const lavaPenguins=[];

for(let i=0;i<10;i++){

lavaPenguins.push({

angle:Math.random()*6.28,

distance:180+Math.random()*80,

y:Math.random()*10000,

speed:0.01+Math.random()*0.03,

attack:0

});

}

const magma=[];

for(let i=0;i<80;i++){

magma.push({

x:(Math.random()-0.5)*120,

y:-i*250,

taken:false

});

}

let train={
active:false,
y:2000
};

setInterval(()=>{

if(gameStarted&&!train.active){

train.active=true;

train.y=player.y+1800;

alert.style.display='block';

setTimeout(()=>{

alert.style.display='none';

},2000);

}

},15000);

function update(){

if(!gameStarted)return;

let accel=0.45;

let max=5;

if(keys['shift']){

max=9;

player.slip+=0.5;

}else{

player.slip-=0.3;

}

player.slip=
Math.max(
0,
Math.min(100,player.slip)
);

slipFill.style.width=
player.slip+'%';

if(keys['a'])player.vx-=accel;
if(keys['d'])player.vx+=accel;
if(keys['w'])player.vy-=accel;
if(keys['s'])player.vy+=accel;

player.vx*=0.92;
player.vy*=0.92;

player.vx=
Math.max(-max,
Math.min(max,player.vx));

player.vy=
Math.max(-max,
Math.min(max,player.vy));

player.x+=player.vx;
player.y+=player.vy;

if(player.x<-pathWidth/2
|| player.x>pathWidth/2){

player.lava=true;

}

lavaPenguins.forEach(lp=>{

lp.angle+=lp.speed;

const lx=
Math.sin(lp.angle)
*lp.distance;

const dx=player.x-lx;

if(Math.abs(dx)<70
&& Math.random()<0.02){

lp.attack=20;

player.x += dx>0?40:-40;

}

if(lp.attack>0){

lp.attack--;

}

});

magma.forEach(m=>{

if(m.taken)return;

const dx=player.x-m.x;
const dy=player.y-m.y;

if(Math.abs(dx)<20
&& Math.abs(dy)<20){

m.taken=true;

player.coins++;

coins.innerHTML=
'🧊 '+player.coins;

}

});

if(train.active){

train.y-=12;

if(train.y<player.y+150
&& train.y>player.y-150){

player.lava=true;

}

if(train.y<player.y-3000){

train.active=false;

}

}

if(timer>0){

timer-=1/60;

}else{

endGame();

}

const mins=
Math.floor(timer/60);

const secs=
Math.floor(timer%60)
.toString()
.padStart(2,'0');

document.getElementById('timer')
.innerHTML=`${mins}:${secs}`;

}

async function endGame(){

gameStarted=false;

if(!player.lava
&& currentUser){

await updateDoc(
doc(db,'users',currentUser.uid),
{
magma:increment(10)
}
);

alert(
'GANASTE 10 CUBOS DE MAGMA'
);

}

location.reload();

}

function penguin(x,y,lava=false){

ctx.fillStyle=
lava?'#ff4d00':'white';

ctx.beginPath();

ctx.ellipse(
x,y,
18,24,
0,0,6.28
);

ctx.fill();

ctx.fillStyle='black';

ctx.beginPath();

ctx.arc(x-5,y-5,2,0,6.28);
ctx.arc(x+5,y-5,2,0,6.28);

ctx.fill();

ctx.fillStyle='orange';

ctx.beginPath();

ctx.moveTo(x,y+2);
ctx.lineTo(x-4,y+7);
ctx.lineTo(x+4,y+7);

ctx.fill();

}

function draw(){

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);

const g=
ctx.createLinearGradient(
0,0,
0,canvas.height
);

g.addColorStop(0,'#ff5a00');
g.addColorStop(1,'#551100');

ctx.fillStyle=g;

ctx.fillRect(
0,0,
canvas.width,
canvas.height
);

const cx=
canvas.width/2;

ctx.fillStyle='#523019';

ctx.beginPath();

ctx.moveTo(cx-pathWidth/2,0);

ctx.lineTo(cx+pathWidth/2,0);

ctx.lineTo(
cx+pathWidth/2+140,
canvas.height
);

ctx.lineTo(
cx-pathWidth/2-140,
canvas.height
);

ctx.fill();

magma.forEach(m=>{

if(m.taken)return;

const sy=
m.y-player.y+
canvas.height/2;

if(sy<-50
|| sy>canvas.height+50)
return;

ctx.fillStyle='gold';

ctx.beginPath();

ctx.arc(
cx+m.x,
sy,
10,
0,
6.28
);

ctx.fill();

});

lavaPenguins.forEach(lp=>{

const sy=
lp.y-player.y+
canvas.height/2;

if(sy<-100
|| sy>canvas.height+100)
return;

let px=
cx+
Math.sin(lp.angle)
*lp.distance;

ctx.fillStyle=
'rgba(255,80,0,.4)';

ctx.beginPath();

ctx.arc(
px,
sy+15,
35,
0,
6.28
);

ctx.fill();

penguin(px,sy,true);

});

if(train.active){

const ty=
train.y-player.y+
canvas.height/2;

ctx.fillStyle='gray';

ctx.fillRect(
cx-150,
ty,
300,
240
);

ctx.fillStyle='yellow';

ctx.fillRect(
cx-100,
ty+40,
50,
50
);

ctx.fillRect(
cx+50,
ty+40,
50,
50
);

}

const py=
canvas.height-180;

ctx.fillStyle='white';

ctx.font='20px Arial';

ctx.fillText(
player.name,
cx+player.x-20,
py-35
);

penguin(
cx+player.x,
py,
player.lava
);

}

function loop(){

update();

draw();

requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
