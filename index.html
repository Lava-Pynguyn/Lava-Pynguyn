¿<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lava Pynguyn FINAL</title>

<style>
body{margin:0;overflow:hidden;background:#120000;font-family:Arial}
canvas{display:block}

.screen{
position:absolute;inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:#1a0000;
color:white;
}

.hidden{display:none!important}

button{padding:12px;margin:6px;border:0;border-radius:10px;background:#ff6a00;color:white}
input{padding:10px;margin:6px;width:220px}

#ui{position:absolute;top:10px;left:10px;color:white}
#score{position:absolute;right:10px;top:80px;color:white}
</style>
</head>

<body>

<div id="auth" class="screen">
<h1>LAVA PYNGUYN</h1>
<input id="email" placeholder="email">
<input id="pass" type="password" placeholder="pass">
<input id="name" placeholder="nombre">
<button onclick="register()">crear</button>
<button onclick="login()">entrar</button>
<p id="err"></p>
</div>

<div id="menu" class="screen hidden">
<button onclick="start()">JUGAR</button>
</div>

<div id="ui">
<div id="coins">🧊 0</div>
<div id="time">120</div>
</div>

<canvas id="c"></canvas>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"

import {getFirestore,doc,setDoc,getDoc,updateDoc}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"

const app=initializeApp({
apiKey:"AIzaSy...",
authDomain:"lava-pynguyn.firebaseapp.com",
projectId:"lava-pynguyn"
})

const auth=getAuth(app)
const db=getFirestore(app)

const c=document.getElementById("c")
const ctx=c.getContext("2d")
c.width=innerWidth
c.height=innerHeight

let user=null

let player={
x:0,y:0,coins:0,lava:false,name:""
}

let keys={}
let slip=0
let time=120
let game=false
let lastSync=0

addEventListener("keydown",e=>keys[e.key]=true)
addEventListener("keyup",e=>keys[e.key]=false)

// AUTH

window.register=async()=>{
try{
const r=await createUserWithEmailAndPassword(auth,email.value,pass.value)
await setDoc(doc(db,"users",r.user.uid),{
name:name.value,
coins:0
})
err.innerText="creado"
}catch(e){err.innerText=e.message}
}

window.login=async()=>{
try{
const r=await signInWithEmailAndPassword(auth,email.value,pass.value)
user=r.user

const d=await getDoc(doc(db,"users",user.uid))

player.name=d.data().name
player.coins=d.data().coins||0

coins.innerText="🧊 "+player.coins

auth.style.display="none"
menu.classList.remove("hidden")

}catch(e){err.innerText=e.message}
}

window.start=()=>{
menu.classList.add("hidden")
game=true
loop()
}

// GAME

const path=60

const cubes=[]
for(let i=0;i<40;i++){
cubes.push({
x:(Math.random()-0.5)*40,
y:-i*200,
taken:false
})
}

function update(){

if(!game)return

if(keys["a"])player.x-=3
if(keys["d"])player.x+=3
if(keys["w"])player.y-=2
if(keys["s"])player.y+=1

if(keys["shift"])slip+=0.5
else slip-=0.3

slip=Math.max(0,Math.min(100,slip))

if(slip>=100){
player.lava=true
slip=0
}

if(player.x<-path||player.x>path){
player.lava=true
}

cubes.forEach(c=>{
if(c.taken)return
if(Math.abs(c.x-player.x)<15 && Math.abs(c.y-player.y)<15){
c.taken=true
player.coins++
coins.innerText="🧊 "+player.coins
}
})

time-=1/60
timeEl.innerText=Math.floor(time)

if(time<=0){
alert("FIN")
location.reload()
}

// sync (IMPORTANTE: lento)
if(user && Date.now()-lastSync>250){
lastSync=Date.now()
setDoc(doc(db,"players",user.uid),{
x:player.x,
y:player.y,
lava:player.lava,
name:player.name
})
}
}

function draw(){

ctx.clearRect(0,0,c.width,c.height)

const cx=c.width/2

ctx.fillStyle="#5a2d14"
ctx.fillRect(cx-path,0,path*2,c.height)

ctx.fillStyle=player.lava?"orange":"white"
ctx.beginPath()
ctx.arc(cx+player.x,c.height-120,12,0,6.28)
ctx.fill()

cubes.forEach(c=>{
if(c.taken)return
ctx.fillStyle="gold"
ctx.beginPath()
ctx.arc(cx+c.x,c.y-player.y+c.height/2,8,0,6.28)
ctx.fill()
})
}

function loop(){
update()
draw()
requestAnimationFrame(loop)
}

</script>

</body>
</html>
