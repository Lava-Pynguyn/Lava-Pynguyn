
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lava Pynguyn</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:#120000;
color:white;
}

canvas{
display:block;
background:#1a0000;
}

.screen{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:linear-gradient(#120000,#300000);
z-index:20;
}

.hidden{
display:none!important;
}

.title{
font-size:72px;
margin-bottom:20px;
color:#ff7b00;
text-shadow:0 0 25px red;
}

.subtitle{
font-size:22px;
margin-bottom:25px;
opacity:.8;
}

input{
width:320px;
padding:14px;
margin:8px;
border:none;
border-radius:14px;
font-size:18px;
}

button{
padding:14px 28px;
margin:10px;
font-size:20px;
border:none;
border-radius:16px;
background:#ff7b00;
color:white;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:scale(1.05);
}

.disabled{
background:#555!important;
cursor:not-allowed;
}

#topUI{
position:absolute;
top:10px;
left:10px;
z-index:50;
}

#coins{
font-size:24px;
margin-top:10px;
}

#timer{
font-size:32px;
}

#slipBar{
width:240px;
height:22px;
background:#333;
border-radius:20px;
overflow:hidden;
margin-top:12px;
}

#slipFill{
width:0%;
height:100%;
background:orange;
}

#alert{
position:absolute;
top:35%;
width:100%;
text-align:center;
font-size:70px;
font-weight:bold;
color:red;
text-shadow:0 0 20px black;
display:none;
z-index:100;
}

#cartBtn{
position:absolute;
top:12px;
right:12px;
z-index:60;
font-size:24px;
padding:10px 18px;
}

#shop{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:650px;
height:500px;
background:#220000;
border:3px solid orange;
border-radius:24px;
padding:20px;
display:none;
z-index:80;
overflow:auto;
}

.shopGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-top:20px;
}

.shopItem{
background:#330000;
padding:20px;
border-radius:16px;
min-height:120px;
}

.playerCard{
padding:10px;
background:#2d0000;
border-radius:12px;
margin:6px;
font-size:20px;
}

#chat{
position:absolute;
left:10px;
bottom:10px;
width:280px;
height:180px;
background:rgba(0,0,0,.45);
border-radius:14px;
padding:10px;
z-index:40;
}

#chatMessages{
height:120px;
overflow:auto;
font-size:14px;
}

#chatInput{
width:100%;
margin-top:10px;
}

.cubeAnim{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:50px;
z-index:120;
pointer-events:none;
animation:cubeFly 1s forwards;
}

@keyframes cubeFly{
0%{
left:50%;
top:50%;
opacity:1;
transform:scale(1);
}
100%{
left:80px;
top:25px;
opacity:0;
transform:scale(.2);
}
}

</style>
</head>
<body>

<div id="authScreen" class="screen">
<div class="title">LAVA PYNGUYN</div>
<div class="subtitle">Escapa del tren y de los pingüinos de lava</div>

<input id="name" placeholder="nombre">
<input id="email" placeholder="correo">
<input id="password" type="password" placeholder="contraseña">

<button id="registerBtn">CREAR CUENTA</button>
<button id="loginBtn">INICIAR SESIÓN</button>
</div>

<div id="menuScreen" class="screen hidden">
<div class="title">MENÚ</div>
<button id="publicBtn">PARTIDA PÚBLICA</button>
<button id="privateBtn">PARTIDA PRIVADA</button>
<button id="trainingBtn">ENTRENAMIENTO</button>
</div>

<div id="publicScreen" class="screen hidden">
<div class="title">BUSCANDO PARTIDA</div>
<div id="publicCount">1/5</div>
</div>

<div id="privateScreen" class="screen hidden">
<div class="title">PARTIDA PRIVADA</div>
<button id="createRoomBtn">CREAR PARTIDA</button>
<input id="roomInput" placeholder="código">
<button id="joinRoomBtn">UNIRSE</button>
</div>

<div id="roomScreen" class="screen hidden">
<div class="title">SALA</div>
<div id="roomCode" style="font-size:48px;color:gold;">AAAAA</div>
<div id="lobbyPlayers"></div>
<button id="startBtn" class="disabled">MÍNIMO 3 JUGADORES</button>
</div>

<button id="cartBtn" class="hidden">🛒</button>

<div id="shop">
<h1>TIENDA</h1>
<div class="shopGrid">
<div class="shopItem">Skin Pingüino Azul<br><br>Próximamente</div>
<div class="shopItem">Sombrero Volcánico<br><br>Próximamente</div>
<div class="shopItem">Traje de Lava<br><br>Próximamente</div>
<div class="shopItem">Rastro de Fuego<br><br>Próximamente</div>
</div>
<button id="closeShop">Cerrar</button>
</div>

<div id="topUI" class="hidden">
<div id="timer">2:30</div>
<div id="coins">🧊 0</div>
<div id="slipBar"><div id="slipFill"></div></div>
</div>

<div id="chat" class="hidden">
<div id="chatMessages"></div>
<input id="chatInput" placeholder="mensaje...">
</div>

<div id="alert">🚨 ALERTA 🚨</div>

<canvas id="game"></canvas>

<script type="module">

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'

import {
getFirestore,
doc,
setDoc,
getDoc,
updateDoc,
increment
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'

const firebaseConfig={
apiKey:"AIzaSyBy1mulELJTWX0AF-ludd-KCvNysc46miA",
authDomain:"lava-pynguyn.firebaseapp.com",
projectId:"lava-pynguyn",
storageBucket:"lava-pynguyn.firebasestorage.app",
messagingSenderId:"642131777706",
appId:"1:642131777706:web:1b4f6c8a47bb184c8e98d3"
}

const app=initializeApp(firebaseConfig)
const auth=getAuth(app)
const db=getFirestore(app)

const canvas=document.getElementById('game')
const ctx=canvas.getContext('2d')

canvas.width=innerWidth
canvas.height=innerHeight

const screens={
auth:document.getElementById('authScreen'),
menu:document.getElementById('menuScreen'),
public:document.getElementById('publicScreen'),
private:document.getElementById('privateScreen'),
room:document.getElementById('roomScreen')
}

function show(name){
Object.values(screens).forEach(s=>s.classList.add('hidden'))
screens[name].classList.remove('hidden')
}

const state={
currentUser:null,
roomId:'',
gameStarted:false,
coins:0,
timer:150,
playersInLobby:1,
messages:[]
}

const player={
name:'Player',
x:0,
y:0,
vx:0,
vy:0,
slip:0,
lava:false,
speed:5,
rotation:0
}

const keys={}

addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true
})

addEventListener('keyup',e=>{
keys[e.key.toLowerCase()]=false
})

async function register(){

const name=document.getElementById('name').value
const email=document.getElementById('email').value
const password=document.getElementById('password').value

if(!name||!email||!password){
alert('Completa todo')
return
}

try{

const cred=await createUserWithEmailAndPassword(auth,email,password)

await setDoc(doc(db,'users',cred.user.uid),{
name:name,
magma:0,
wins:0,
skin:'default'
})

alert('Cuenta creada correctamente')

}catch(err){
alert(err.message)
}
}

async function login(){

const email=document.getElementById('email').value
const password=document.getElementById('password').value

try{

const cred=await signInWithEmailAndPassword(auth,email,password)

state.currentUser=cred.user

const snap=await getDoc(doc(db,'users',cred.user.uid))

if(snap.exists()){
const data=snap.data()
player.name=data.name
state.coins=data.magma||0
}

document.getElementById('coins').innerHTML='🧊 '+state.coins

show('menu')

document.getElementById('cartBtn').classList.remove('hidden')

}catch(err){
alert(err.message)
}
}

document.getElementById('registerBtn').onclick=register

document.getElementById('loginBtn').onclick=login

const shop=document.getElementById('shop')

document.getElementById('cartBtn').onclick=()=>{
shop.style.display='block'
}

document.getElementById('closeShop').onclick=()=>{
shop.style.display='none'
}

function randomCode(){
const chars='ABCDEFGHJKLMNPQRSTUVWXYZ123456789'
let code=''
for(let i=0;i<5;i++){
code+=chars[Math.floor(Math.random()*chars.length)]
}
return code
}

document.getElementById('publicBtn').onclick=()=>{
show('public')

let current=1

const matchmaking=setInterval(()=>{
current++

document.getElementById('publicCount').innerHTML=current+'/5'

if(current>=5){
clearInterval(matchmaking)
startGame()
}

},1000)
}

document.getElementById('privateBtn').onclick=()=>{
show('private')
}

document.getElementById('trainingBtn').onclick=()=>{
startGame()
}

document.getElementById('createRoomBtn').onclick=()=>{
state.roomId=randomCode()
openRoom([
player.name,
'Jugador2',
'Jugador3'
])
}

document.getElementById('joinRoomBtn').onclick=()=>{
state.roomId=document.getElementById('roomInput').value.toUpperCase()

if(state.roomId.length<5){
alert('Código inválido')
return
}

openRoom([
player.name,
'Jugador2',
'Jugador3',
'Jugador4'
])
}

function openRoom(players){
show('room')

document.getElementById('roomCode').innerHTML=state.roomId

const lobby=document.getElementById('lobbyPlayers')

let html=''

players.forEach(p=>{
html+=`<div class="playerCard">🐧 ${p}</div>`
})

html+=`<br>${players.length}/5`

lobby.innerHTML=html

const btn=document.getElementById('startBtn')

if(players.length>=3){
btn.classList.remove('disabled')
btn.innerHTML='JUGAR'
btn.onclick=()=>{
const lava=players[Math.floor(Math.random()*players.length)]
alert(lava+' ES EL PINGÜINO DE LAVA')
startGame()
}
}
}

function startGame(){
state.gameStarted=true

Object.values(screens).forEach(s=>s.classList.add('hidden'))

document.getElementById('topUI').classList.remove('hidden')
document.getElementById('chat').classList.remove('hidden')
}

const pathWidth=260

const cubes=[]
for(let i=0;i<80;i++){
cubes.push({
x:(Math.random()-0.5)*180,
y:-i*260,
taken:false
})
}

const lavaPenguins=[]
for(let i=0;i<12;i++){
lavaPenguins.push({
angle:Math.random()*6.28,
distance:190+Math.random()*90,
y:Math.random()*9000,
speed:0.01+Math.random()*0.02
})
}

const particles=[]

let train={
active:false,
y:2000
}

setInterval(()=>{
if(state.gameStarted&&!train.active){
train.active=true
train.y=player.y+1800

const alert=document.getElementById('alert')
alert.style.display='block'

setTimeout(()=>{
alert.style.display='none'
},2000)
}
},18000)

function cubeAnimation(){
const div=document.createElement('div')
div.className='cubeAnim'
div.innerHTML='🧊 +1'
document.body.appendChild(div)
setTimeout(()=>div.remove(),1000)
}

function update(){

if(!state.gameStarted)return

let accel=.4
let max=5

if(keys['shift']){
max=9
player.slip+=.5
}else{
player.slip-=.25
}

player.slip=Math.max(0,Math.min(100,player.slip))

document.getElementById('slipFill').style.width=player.slip+'%'

if(keys['a'])player.vx-=accel
if(keys['d'])player.vx+=accel
if(keys['w'])player.vy-=accel
if(keys['s'])player.vy+=accel

player.vx*=.92
player.vy*=.92

player.vx=Math.max(-max,Math.min(max,player.vx))
player.vy=Math.max(-max,Math.min(max,player.vy))

player.x+=player.vx
player.y+=player.vy

if(player.x<-pathWidth/2||player.x>pathWidth/2){
player.lava=true
}

cubes.forEach(c=>{

if(c.taken)return

const dx=player.x-c.x
const dy=player.y-c.y

if(Math.abs(dx)<22&&Math.abs(dy)<22){

c.taken=true
state.coins++

cubeAnimation()

document.getElementById('coins').innerHTML='🧊 '+state.coins

for(let i=0;i<6;i++){
particles.push({
x:c.x,
y:c.y,
vx:(Math.random()-.5)*4,
vy:(Math.random()-.5)*4,
life:30
})
}
}
})

particles.forEach(p=>{
p.x+=p.vx
p.y+=p.vy
p.life--
})

for(let i=particles.length-1;i>=0;i--){
if(particles[i].life<=0){
particles.splice(i,1)
}
}

if(train.active){
train.y-=12

if(train.y<player.y+150&&train.y>player.y-150){
player.lava=true
}

if(train.y<player.y-3000){
train.active=false
}
}

if(state.timer>0){
state.timer-=1/60
}else{
endGame()
}

const mins=Math.floor(state.timer/60)
const secs=Math.floor(state.timer%60).toString().padStart(2,'0')

document.getElementById('timer').innerHTML=`${mins}:${secs}`
}

async function endGame(){

state.gameStarted=false

if(!player.lava&&state.currentUser){

await updateDoc(doc(db,'users',state.currentUser.uid),{
magma:increment(10)
})

alert('GANASTE 10 CUBOS DE MAGMA')
}

location.reload()
}

function drawPenguin(x,y,lava=false){

ctx.save()
ctx.translate(x,y)

ctx.fillStyle=lava?'#ff4d00':'white'
ctx.beginPath()
ctx.ellipse(0,0,18,24,0,0,6.28)
ctx.fill()

ctx.fillStyle='black'
ctx.beginPath()
ctx.arc(-5,-5,2,0,6.28)
ctx.arc(5,-5,2,0,6.28)
ctx.fill()

ctx.fillStyle='orange'
ctx.beginPath()
ctx.moveTo(0,2)
ctx.lineTo(-4,7)
ctx.lineTo(4,7)
ctx.fill()

ctx.restore()
}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

const g=ctx.createLinearGradient(0,0,0,canvas.height)
g.addColorStop(0,'#ff5a00')
g.addColorStop(1,'#551100')
ctx.fillStyle=g
ctx.fillRect(0,0,canvas.width,canvas.height)

const cx=canvas.width/2

ctx.fillStyle='#523019'
ctx.beginPath()
ctx.moveTo(cx-pathWidth/2,0)
ctx.lineTo(cx+pathWidth/2,0)
ctx.lineTo(cx+pathWidth/2+140,canvas.height)
ctx.lineTo(cx-pathWidth/2-140,canvas.height)
ctx.fill()

for(let i=0;i<40;i++){
ctx.fillStyle='rgba(0,0,0,.08)'
ctx.fillRect(cx-110+Math.sin(i)*25,i*45,220,18)
}

cubes.forEach(c=>{

if(c.taken)return

const sy=c.y-player.y+canvas.height/2

if(sy<-50||sy>canvas.height+50)return

ctx.fillStyle='gold'
ctx.beginPath()
ctx.arc(cx+c.x,sy,10,0,6.28)
ctx.fill()
})

particles.forEach(p=>{
const sy=p.y-player.y+canvas.height/2
ctx.fillStyle='orange'
ctx.fillRect(cx+p.x,sy,4,4)
})

lavaPenguins.forEach(lp=>{

const sy=lp.y-player.y+canvas.height/2

if(sy<-100||sy>canvas.height+100)return

const px=cx+Math.sin(lp.angle)*lp.distance

ctx.fillStyle='rgba(255,80,0,.35)'
ctx.beginPath()
ctx.arc(px,sy+18,35,0,6.28)
ctx.fill()

drawPenguin(px,sy,true)
})

if(train.active){

const ty=train.y-player.y+canvas.height/2

ctx.fillStyle='gray'
ctx.fillRect(cx-150,ty,300,240)

ctx.fillStyle='yellow'
ctx.fillRect(cx-100,ty+40,50,50)
ctx.fillRect(cx+50,ty+40,50,50)
}

const py=canvas.height-180

ctx.fillStyle='white'
ctx.font='20px Arial'
ctx.fillText(player.name,cx+player.x-20,py-35)

drawPenguin(cx+player.x,py,player.lava)

if(player.lava){
ctx.fillStyle='white'
ctx.font='58px Arial'
ctx.fillText('TE VOLVISTE PINGÜINO DE LAVA',80,canvas.height/2)
}
}

function loop(){
update()
draw()
requestAnimationFrame(loop)
}

loop()

</script>

</body>
</html>
