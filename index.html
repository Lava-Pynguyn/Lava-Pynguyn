
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lava Pynguyn</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:#120000;
}

canvas{
display:block;
}

.screen{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:linear-gradient(#120000,#2b0000);
z-index:20;
}

.hidden{
display:none!important;
}

.title{
font-size:70px;
color:#ff7b00;
text-shadow:0 0 25px red;
margin-bottom:20px;
}

input{
width:320px;
padding:14px;
margin:10px;
border:none;
border-radius:16px;
font-size:18px;
}

button{
padding:14px 26px;
margin:10px;
font-size:20px;
border:none;
border-radius:16px;
background:#ff7b00;
color:white;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:scale(1.05);
}

#topUI{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:50;
}

#coins{
font-size:24px;
margin-top:8px;
}

#timer{
font-size:36px;
}

#slipBar{
width:220px;
height:20px;
background:#222;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

#slipFill{
width:0%;
height:100%;
background:orange;
}

#alert{
position:absolute;
width:100%;
top:35%;
text-align:center;
font-size:70px;
font-weight:bold;
color:red;
text-shadow:0 0 20px black;
display:none;
z-index:100;
}

#cartBtn{
position:absolute;
top:12px;
right:12px;
z-index:50;
font-size:24px;
}

#shop{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:550px;
height:420px;
background:#220000;
border:3px solid orange;
border-radius:20px;
padding:20px;
display:none;
z-index:80;
color:white;
}

.playerCard{
padding:10px;
background:#2b0000;
border-radius:12px;
margin:6px;
font-size:20px;
}

#chat{
position:absolute;
left:10px;
bottom:10px;
width:280px;
height:180px;
background:rgba(0,0,0,.4);
border-radius:14px;
padding:10px;
z-index:50;
color:white;
}

#chatMessages{
height:120px;
overflow:auto;
font-size:14px;
}

#chatInput{
width:100%;
margin-top:10px;
}

.cubeAnim{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:52px;
pointer-events:none;
animation:cubeFly 1s forwards;
z-index:100;
}

@keyframes cubeFly{
0%{
left:50%;
top:50%;
opacity:1;
}
100%{
left:80px;
top:20px;
opacity:0;
}
}

</style>
</head>
<body>

<div id="authScreen" class="screen">
<div class="title">LAVA PYNGUYN</div>
<input id="name" placeholder="nombre">
<input id="email" placeholder="correo">
<input id="password" type="password" placeholder="contraseña">
<button id="registerBtn">CREAR CUENTA</button>
<button id="loginBtn">INICIAR SESIÓN</button>
</div>

<div id="menuScreen" class="screen hidden">
<div class="title">MENÚ</div>
<button id="publicBtn">PARTIDA PÚBLICA</button>
<button id="privateBtn">PARTIDA PRIVADA</button>
<button id="trainingBtn">ENTRENAMIENTO</button>
</div>

<div id="privateScreen" class="screen hidden">
<div class="title">PARTIDA PRIVADA</div>
<button id="createRoomBtn">CREAR PARTIDA</button>
<input id="roomInput" placeholder="código">
<button id="joinRoomBtn">UNIRSE</button>
</div>

<div id="roomScreen" class="screen hidden">
<div class="title">SALA</div>
<div id="roomCode" style="font-size:50px;color:gold"></div>
<div id="lobbyPlayers"></div>
<button id="startBtn">ESPERANDO JUGADORES</button>
</div>

<button id="cartBtn" class="hidden">🛒</button>

<div id="shop">
<h1>TIENDA</h1>
<br>
<p>Skins próximamente...</p>
<br>
<button id="closeShop">Cerrar</button>
</div>

<div id="topUI" class="hidden">
<div id="timer">2:30</div>
<div id="coins">🧊 0</div>
<div id="slipBar"><div id="slipFill"></div></div>
</div>

<div id="chat" class="hidden">
<div id="chatMessages"></div>
<input id="chatInput" placeholder="mensaje...">
</div>

<div id="alert">🚨 ALERTA 🚨</div>

<canvas id="game"></canvas>

<script type="module">

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'

import {
getFirestore,
doc,
setDoc,
getDoc,
updateDoc,
increment,
collection,
onSnapshot,
serverTimestamp,
addDoc
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'

const firebaseConfig={
apiKey:"AIzaSyBy1mulELJTWX0AF-ludd-KCvNysc46miA",
authDomain:"lava-pynguyn.firebaseapp.com",
projectId:"lava-pynguyn",
storageBucket:"lava-pynguyn.firebasestorage.app",
messagingSenderId:"642131777706",
appId:"1:642131777706:web:1b4f6c8a47bb184c8e98d3"
}

const app=initializeApp(firebaseConfig)
const auth=getAuth(app)
const db=getFirestore(app)

const canvas=document.getElementById('game')
const ctx=canvas.getContext('2d')

canvas.width=innerWidth
canvas.height=innerHeight

const screens={
auth:document.getElementById('authScreen'),
menu:document.getElementById('menuScreen'),
private:document.getElementById('privateScreen'),
room:document.getElementById('roomScreen')
}

function show(name){
Object.values(screens).forEach(s=>s.classList.add('hidden'))
screens[name].classList.remove('hidden')
}

let currentRoom=''
let onlinePlayers=[]

const state={
currentUser:null,
coins:0,
gameStarted:false,
timer:150,
private:false
}

const player={
name:'Player',
x:0,
y:0,
slip:0,
lava:false,
speed:5
}

const keys={}

addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true
})

addEventListener('keyup',e=>{
keys[e.key.toLowerCase()]=false
})

async function register(){

const name=document.getElementById('name').value
const email=document.getElementById('email').value
const password=document.getElementById('password').value

try{

const cred=await createUserWithEmailAndPassword(auth,email,password)

await setDoc(doc(db,'users',cred.user.uid),{
name:name,
magma:0
})

alert('Cuenta creada')

}catch(err){
alert(err.message)
}
}

async function login(){

const email=document.getElementById('email').value
const password=document.getElementById('password').value

try{

const cred=await signInWithEmailAndPassword(auth,email,password)

state.currentUser=cred.user

const snap=await getDoc(doc(db,'users',cred.user.uid))

if(snap.exists()){
const data=snap.data()
player.name=data.name
state.coins=data.magma||0
}

document.getElementById('coins').innerHTML='🧊 '+state.coins

show('menu')

document.getElementById('cartBtn').classList.remove('hidden')

}catch(err){
alert(err.message)
}
}

document.getElementById('registerBtn').onclick=register

document.getElementById('loginBtn').onclick=login

const shop=document.getElementById('shop')

document.getElementById('cartBtn').onclick=()=>{
shop.style.display='block'
}

document.getElementById('closeShop').onclick=()=>{
shop.style.display='none'
}

function randomCode(){
const chars='ABCDEFGHJKLMNPQRSTUVWXYZ123456789'
let code=''
for(let i=0;i<5;i++){
code+=chars[Math.floor(Math.random()*chars.length)]
}
return code
}

async function createRoom(){

state.private=true

const code=randomCode()
currentRoom=code

await setDoc(doc(db,'rooms',code),{
created:serverTimestamp()
})

await setDoc(
doc(db,'rooms',code,'players',state.currentUser.uid),
{
name:player.name,
x:0,
y:0,
lava:false
}
)

listenRoom(code)

show('room')

document.getElementById('roomCode').innerHTML=code
}

async function joinRoom(){

state.private=true

const code=document.getElementById('roomInput').value.toUpperCase()

currentRoom=code

await setDoc(
doc(db,'rooms',code,'players',state.currentUser.uid),
{
name:player.name,
x:0,
y:0,
lava:false
}
)

listenRoom(code)

show('room')

document.getElementById('roomCode').innerHTML=code
}

function listenRoom(code){

const ref=collection(db,'rooms',code,'players')

onSnapshot(ref,snap=>{

onlinePlayers=[]

snap.forEach(d=>{
onlinePlayers.push(d.data())
})

renderLobby()

})
}

function renderLobby(){

const lobby=document.getElementById('lobbyPlayers')

let html=''

onlinePlayers.forEach(p=>{
html+=`<div class="playerCard">🐧 ${p.name}</div>`
})

html+=`<br>${onlinePlayers.length}/5`

lobby.innerHTML=html

const btn=document.getElementById('startBtn')

if(onlinePlayers.length>=2){
btn.innerHTML='JUGAR'
btn.onclick=()=>startGame()
}
}

document.getElementById('privateBtn').onclick=()=>{
show('private')
}

document.getElementById('createRoomBtn').onclick=createRoom

document.getElementById('joinRoomBtn').onclick=joinRoom

document.getElementById('trainingBtn').onclick=()=>{
state.private=false
startGame()
}

document.getElementById('publicBtn').onclick=()=>{
state.private=false
startGame()
}

function startGame(){

state.gameStarted=true

Object.values(screens).forEach(s=>s.classList.add('hidden'))

document.getElementById('topUI').classList.remove('hidden')
document.getElementById('chat').classList.remove('hidden')
}

const pathWidth=100

const cubes=[]
for(let i=0;i<70;i++){
cubes.push({
x:(Math.random()-.5)*70,
y:-i*250,
taken:false
})
}

const lavaPenguins=[]
for(let i=0;i<6;i++){
lavaPenguins.push({
side:Math.random()>.5?1:-1,
y:-Math.random()*5000,
jump:0,
jumping:false
})
}

const bot={
active:true,
x:0,
y:-300,
name:'BOT'
}

let train={
active:false,
y:2000
}

setInterval(()=>{

if(state.gameStarted&&!train.active){

train.active=true
train.y=player.y+1800

const alert=document.getElementById('alert')
alert.style.display='block'

setTimeout(()=>{
alert.style.display='none'
},2000)

}

},20000)

function cubeAnimation(){
const div=document.createElement('div')
div.className='cubeAnim'
div.innerHTML='🧊 +1'
document.body.appendChild(div)
setTimeout(()=>div.remove(),1000)
}

const chatInput=document.getElementById('chatInput')
const chatMessages=document.getElementById('chatMessages')

chatInput.addEventListener('keydown',async e=>{

if(e.key==='Enter'){

const text=chatInput.value

if(text==='')return

const div=document.createElement('div')
div.innerHTML=`🐧 ${player.name}: ${text}`
chatMessages.appendChild(div)

chatInput.value=''
chatMessages.scrollTop=chatMessages.scrollHeight

if(currentRoom){

await addDoc(
collection(db,'rooms',currentRoom,'chat'),
{
name:player.name,
text:text,
time:Date.now()
}
)

}

}
})

function update(){

if(!state.gameStarted)return

if(keys['shift']){
player.speed=9
player.slip+=0.45
}else{
player.speed=5
player.slip-=0.25
}

player.slip=Math.max(0,Math.min(100,player.slip))

if(player.slip>=100){
player.lava=true
}

if(keys['a'])player.x-=player.speed
if(keys['d'])player.x+=player.speed

if(keys['w'])player.y-=7
if(keys['s'])player.y+=4

if(player.x<-pathWidth/2||player.x>pathWidth/2){
player.lava=true
}

bot.y-=4

if(bot.y<player.y-1000){
bot.y=player.y+500
}

lavaPenguins.forEach(lp=>{

lp.y+=3

if(lp.y>player.y-300&&lp.y<player.y+300&&!lp.jumping){

lp.jumping=true
lp.jump=35

}

if(lp.jumping){

lp.jump-=2

if(lp.jump<=0){

lp.jumping=false
lp.jump=0

}

}

const lavaX=(pathWidth/2+55)*lp.side

const dx=player.x-lavaX
const dy=player.y-lp.y

if(Math.abs(dx)<40&&Math.abs(dy)<40&&lp.jumping){
player.x+=lp.side*20
}

})

cubes.forEach(c=>{

if(c.taken)return

const dx=player.x-c.x
const dy=player.y-c.y

if(Math.abs(dx)<20&&Math.abs(dy)<20){

c.taken=true
state.coins++

document.getElementById('coins').innerHTML='🧊 '+state.coins

cubeAnimation()

}
})

if(currentRoom){

setDoc(
doc(db,'rooms',currentRoom,'players',state.currentUser.uid),
{
name:player.name,
x:player.x,
y:player.y,
lava:player.lava
}
)

}

if(train.active){

train.y-=12

if(train.y<player.y+150&&train.y>player.y-150){
player.lava=true
}

if(train.y<player.y-3000){
train.active=false
}

}

if(state.timer>0){
state.timer-=1/60
}else{
endGame()
}

const mins=Math.floor(state.timer/60)
const secs=Math.floor(state.timer%60).toString().padStart(2,'0')

document.getElementById('timer').innerHTML=`${mins}:${secs}`

document.getElementById('slipFill').style.width=player.slip+'%'
}

async function endGame(){

state.gameStarted=false

if(!player.lava&&state.currentUser){

await updateDoc(doc(db,'users',state.currentUser.uid),{
magma:increment(10)
})

alert('GANASTE 10 CUBOS')

}

location.reload()
}

function drawPenguin(x,y,lava=false){

ctx.save()
ctx.translate(x,y)

ctx.fillStyle=lava?'#ff4d00':'white'
ctx.beginPath()
ctx.ellipse(0,0,16,22,0,0,6.28)
ctx.fill()

ctx.fillStyle='black'
ctx.beginPath()
ctx.arc(-4,-5,2,0,6.28)
ctx.arc(4,-5,2,0,6.28)
ctx.fill()

ctx.fillStyle='orange'
ctx.beginPath()
ctx.moveTo(0,2)
ctx.lineTo(-4,7)
ctx.lineTo(4,7)
ctx.fill()

ctx.restore()
}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

for(let y=0;y<canvas.height;y+=40){
ctx.fillStyle=`rgb(${180+Math.sin(Date.now()*0.002+y)*40},40,0)`
ctx.fillRect(0,y,canvas.width,40)
}

const cx=canvas.width/2

const dirt=ctx.createLinearGradient(0,0,0,canvas.height)
dirt.addColorStop(0,'#6b4423')
dirt.addColorStop(1,'#3a1f0f')
ctx.fillStyle=dirt

ctx.beginPath()
ctx.moveTo(cx-pathWidth/2,0)
ctx.lineTo(cx+pathWidth/2,0)
ctx.lineTo(cx+pathWidth/2+30,canvas.height)
ctx.lineTo(cx-pathWidth/2-30,canvas.height)
ctx.fill()

for(let i=0;i<60;i++){
ctx.fillStyle='rgba(0,0,0,.08)'
ctx.fillRect(cx-45+Math.sin(i)*10,i*40,90,10)
}

cubes.forEach(c=>{

if(c.taken)return

const sy=c.y-player.y+canvas.height/2

ctx.fillStyle='gold'
ctx.beginPath()
ctx.arc(cx+c.x,sy,10,0,6.28)
ctx.fill()
})

lavaPenguins.forEach(lp=>{

const sy=lp.y-player.y+canvas.height/2

const lavaX=(pathWidth/2+55)*lp.side

ctx.fillStyle='rgba(255,80,0,.25)'
ctx.beginPath()
ctx.arc(cx+lavaX,sy+20,35,0,6.28)
ctx.fill()

drawPenguin(cx+lavaX,sy-lp.jump,true)

})

if(!state.private){

const botY=bot.y-player.y+canvas.height/2

ctx.fillStyle='white'
ctx.font='18px Arial'
ctx.fillText(bot.name,cx+bot.x-15,botY-30)

drawPenguin(cx+bot.x,botY,false)

}

onlinePlayers.forEach(op=>{

if(op.name===player.name)return

const sy=op.y-player.y+canvas.height/2
const px=cx+op.x

ctx.fillStyle='white'
ctx.font='18px Arial'
ctx.fillText(op.name,px-20,sy-30)

drawPenguin(px,sy,op.lava)

})

if(train.active){

const ty=train.y-player.y+canvas.height/2

ctx.fillStyle='#555'
ctx.fillRect(cx-120,ty,240,180)

ctx.fillStyle='yellow'
ctx.fillRect(cx-70,ty+35,40,40)
ctx.fillRect(cx+30,ty+35,40,40)

}

const py=canvas.height-170

ctx.fillStyle='rgba(0,0,0,.25)'
ctx.beginPath()
ctx.ellipse(cx+player.x,py+22,18,8,0,0,6.28)
ctx.fill()

ctx.fillStyle='white'
ctx.font='18px Arial'
ctx.fillText(player.name,cx+player.x-20,py-30)

drawPenguin(cx+player.x,py,player.lava)

if(player.lava){
ctx.fillStyle='white'
ctx.font='50px Arial'
ctx.fillText('TE VOLVISTE PINGÜINO DE LAVA',50,canvas.height/2)
}
}

function loop(){
update()
draw()
requestAnimationFrame(loop)
}

loop()

</script>
</body>
</html>
