<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lava Pynguyn</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
overflow:hidden;
background:black;
}

canvas{
display:block;
}

#menu{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:linear-gradient(#120000,#300000);
color:white;
z-index:10;
}

#menu h1{
font-size:80px;
margin-bottom:20px;
color:orange;
text-shadow:0 0 20px red;
}

#menu button{
padding:20px 40px;
font-size:30px;
border:none;
border-radius:20px;
background:orange;
cursor:pointer;
}

#ui{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:5;
}

#bar{
width:220px;
height:20px;
background:#333;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

#slip{
width:0%;
height:100%;
background:orange;
}

#alert{
position:absolute;
top:40%;
width:100%;
text-align:center;
font-size:70px;
font-weight:bold;
color:red;
display:none;
z-index:8;
text-shadow:0 0 20px black;
}
</style>
</head>
<body>

<div id="menu">
<h1>LAVA PYNGUYN</h1>
<p style="margin-bottom:30px;font-size:25px;">
ESCAPA DEL TREN Y DE LOS PINGÜINOS DE LAVA
</p>
<button onclick="startGame()">JUGAR</button>
</div>

<div id="ui">
<div>SHIFT = correr</div>
<div id="bar">
<div id="slip"></div>
</div>
</div>

<div id="alert">🚨 ALERTA DE TREN 🚨</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let started=false;

function startGame(){
started=true;
document.getElementById('menu').style.display='none';
}

const player={
x:0,
y:0,
worldY:0,
slip:0,
lava:false
};

const keys={};

window.addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true;
});

window.addEventListener('keyup',e=>{
keys[e.key.toLowerCase()]=false;
});

const path={
width:220
};

const lavaPenguins=[];

for(let i=0;i<12;i++){
lavaPenguins.push({
side:Math.random()<0.5?-1:1,
y:Math.random()*6000,
attack:false,
attackTime:0
});
}

let train={
active:false,
y:-1000
};

setInterval(()=>{
if(started&&!train.active){
train.active=true;
train.y=player.worldY+1200;

document.getElementById('alert').style.display='block';

setTimeout(()=>{
document.getElementById('alert').style.display='none';
},2000);
}
},15000);

function update(){
if(!started)return;

let speed=5;

if(keys['shift']){
speed=10;
player.slip+=0.5;
}else{
player.slip-=0.25;
}

player.slip=Math.max(0,Math.min(100,player.slip));

document.getElementById('slip').style.width=player.slip+'%';

if(player.slip>=100){
player.x+=(Math.random()-0.5)*15;
}

if(keys['a'])player.x-=speed;
if(keys['d'])player.x+=speed;
if(keys['w'])player.worldY-=speed;
if(keys['s'])player.worldY+=speed;

if(player.x<-path.width/2||player.x>path.width/2){
player.lava=true;
}

lavaPenguins.forEach(lp=>{
const dy=lp.y-player.worldY;

if(Math.abs(dy)<300&&Math.random()<0.01){
lp.attack=true;
lp.attackTime=20;

if(Math.abs(player.x)<70){
player.x+=lp.side*80;
}
}

if(lp.attackTime>0){
lp.attackTime--;
}else{
lp.attack=false;
}
});

if(train.active){
train.y-=14;

if(train.y<player.worldY+200&&train.y>player.worldY-200){
player.lava=true;
}

if(train.y<player.worldY-3000){
train.active=false;
}
}
}

function drawPenguin(x,y,lava=false){
ctx.fillStyle=lava?'#ff4d00':'white';
ctx.beginPath();
ctx.ellipse(x,y,18,25,0,0,Math.PI*2);
ctx.fill();

ctx.fillStyle='black';
ctx.beginPath();
ctx.arc(x-5,y-5,2,0,Math.PI*2);
ctx.arc(x+5,y-5,2,0,Math.PI*2);
ctx.fill();

ctx.fillStyle='orange';
ctx.beginPath();
ctx.moveTo(x,y+2);
ctx.lineTo(x-4,y+7);
ctx.lineTo(x+4,y+7);
ctx.fill();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle='#ff5a00';
ctx.fillRect(0,0,canvas.width,canvas.height);

const centerX=canvas.width/2;

ctx.fillStyle='#5a3a20';
ctx.beginPath();
ctx.moveTo(centerX-path.width/2,0);
ctx.lineTo(centerX+path.width/2,0);
ctx.lineTo(centerX+path.width/2+120,canvas.height);
ctx.lineTo(centerX-path.width/2-120,canvas.height);
ctx.fill();

for(let i=0;i<40;i++){
ctx.fillStyle='rgba(0,0,0,0.1)';
ctx.fillRect(centerX-100+Math.sin(i)*30,i*50,200,20);
}

lavaPenguins.forEach(lp=>{
const screenY=lp.y-player.worldY+canvas.height/2;

if(screenY>-100&&screenY<canvas.height+100){
let x=centerX+(path.width/2+60)*lp.side;

if(lp.attack){
x=centerX+(path.width/2-20)*lp.side;
}

ctx.beginPath();
ctx.fillStyle='#ff2200';
ctx.arc(x,screenY+20,30,0,Math.PI*2);
ctx.fill();

drawPenguin(x,screenY,true);
}
});

if(train.active){
const trainScreen=train.y-player.worldY+canvas.height/2;

ctx.fillStyle='gray';
ctx.fillRect(centerX-140,trainScreen,280,220);

ctx.fillStyle='yellow';
ctx.fillRect(centerX-100,trainScreen+40,50,50);
ctx.fillRect(centerX+50,trainScreen+40,50,50);
}

const py=canvas.height-180;

drawPenguin(centerX+player.x,py,player.lava);

ctx.fillStyle='#00aa66';
ctx.fillRect(centerX-220,-40,440,80);

ctx.fillStyle='white';
ctx.font='30px Arial';
ctx.fillText('SAFE ZONE',centerX-90,40);

if(player.lava){
ctx.fillStyle='white';
ctx.font='60px Arial';
ctx.fillText('TE VOLVISTE PINGÜINO DE LAVA',120,canvas.height/2);
}
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
