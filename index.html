<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lava Pynguyn</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      overflow: hidden;
      background: #111;
    }

    canvas {
      display: block;
      background: linear-gradient(#1a1a1a, #0a0a0a);
    }

    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 10;
    }

    #slipBarContainer {
      width: 220px;
      height: 20px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    #slipBar {
      width: 0%;
      height: 100%;
      background: orange;
    }

    #trainAlert {
      position: absolute;
      top: 40%;
      width: 100%;
      text-align: center;
      font-size: 60px;
      font-weight: bold;
      color: red;
      display: none;
      text-shadow: 0 0 20px black;
      z-index: 20;
    }
  </style>
</head>
<body>

<div id="ui">
  <h1>LAVA PYNGUYN</h1>
  <p>WASD para moverte | SHIFT para correr</p>

  <div id="slipBarContainer">
    <div id="slipBar"></div>
  </div>
</div>

<div id="trainAlert">🚨 ALERTA DE TREN 🚨</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const player = {
  x: canvas.width / 2,
  y: canvas.height - 120,
  size: 25,
  speed: 4,
  runSpeed: 7,
  slipping: 0,
  isLavaPenguin: false
};

const keys = {};

const path = {
  x: canvas.width / 2 - 80,
  width: 160
};

let trainY = -300;
let trainActive = false;

const lavaPenguins = [];

for (let i = 0; i < 5; i++) {
  lavaPenguins.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    jumpTimer: Math.random() * 200
  });
}

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function spawnTrainAlert() {
  trainActive = true;
  document.getElementById("trainAlert").style.display = "block";

  setTimeout(() => {
    document.getElementById("trainAlert").style.display = "none";
  }, 2000);
}

setInterval(() => {
  if (!trainActive) {
    spawnTrainAlert();
  }
}, 12000);

function update() {
  let speed = player.speed;

  if (keys["shift"]) {
    speed = player.runSpeed;
    player.slipping += 0.6;
  } else {
    player.slipping -= 0.3;
  }

  player.slipping = Math.max(0, Math.min(100, player.slipping));

  document.getElementById("slipBar").style.width = player.slipping + "%";

  if (player.slipping >= 100) {
    player.x += (Math.random() - 0.5) * 20;
  }

  if (keys["a"]) player.x -= speed;
  if (keys["d"]) player.x += speed;
  if (keys["w"]) player.y -= speed;
  if (keys["s"]) player.y += speed;

  if (
    player.x < path.x ||
    player.x > path.x + path.width
  ) {
    player.isLavaPenguin = true;
  }

  if (trainActive) {
    trainY += 8;

    if (
      player.y > trainY &&
      player.y < trainY + 200
    ) {
      player.isLavaPenguin = true;
    }

    if (trainY > canvas.height + 300) {
      trainY = -300;
      trainActive = false;
    }
  }

  lavaPenguins.forEach(lp => {
    lp.jumpTimer--;

    if (lp.jumpTimer <= 0) {
      lp.x = Math.random() < 0.5
        ? path.x - 40
        : path.x + path.width + 40;

      lp.y = Math.random() * canvas.height;

      const dx = player.x - lp.x;
      const dy = player.y - lp.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 80) {
        player.x += dx > 0 ? 50 : -50;
      }

      lp.jumpTimer = 100 + Math.random() * 200;
    }
  });
}

function drawLava() {
  ctx.fillStyle = "#ff5a00";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawPath() {
  ctx.fillStyle = "#5b3a1e";

  ctx.fillRect(
    path.x,
    0,
    path.width,
    canvas.height
  );
}

function drawPlayer() {
  ctx.fillStyle = player.isLavaPenguin
    ? "red"
    : "white";

  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "black";
  ctx.beginPath();
  ctx.arc(player.x - 8, player.y - 5, 3, 0, Math.PI * 2);
  ctx.arc(player.x + 8, player.y - 5, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawTrain() {
  if (!trainActive) return;

  ctx.fillStyle = "gray";

  ctx.fillRect(
    path.x,
    trainY,
    path.width,
    200
  );

  ctx.fillStyle = "yellow";

  ctx.fillRect(path.x + 20, trainY + 20, 30, 30);
  ctx.fillRect(path.x + 110, trainY + 20, 30, 30);
}

function drawLavaPenguins() {
  lavaPenguins.forEach(lp => {
    ctx.fillStyle = "red";

    ctx.beginPath();
    ctx.arc(lp.x, lp.y, 20, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawSafeZone() {
  ctx.fillStyle = "#00aa66";

  ctx.fillRect(
    path.x - 40,
    0,
    path.width + 80,
    100
  );

  ctx.fillStyle = "white";
  ctx.font = "30px Arial";
  ctx.fillText("SAFE ZONE", path.x - 10, 60);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawLava();
  drawPath();
  drawSafeZone();
  drawTrain();
  drawLavaPenguins();
  drawPlayer();

  if (player.isLavaPenguin) {
    ctx.fillStyle = "white";
    ctx.font = "50px Arial";
    ctx.fillText("TE CONVERTISTE EN PINGÜINO DE LAVA", 100, canvas.height / 2);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
